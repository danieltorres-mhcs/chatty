<style>
:root{--bg:#fff;--fg:#111;--mute:#6b6b6b;--line:#d9d9d9;--err:#b00020;--r:2px;--u:8px;

.btn{height:40px;padding:0 16px;border:1px solid var(--fg);border-radius:var(--r);background:var(--fg);color:var(--bg);cursor:pointer;transition:opacity .12s}

fieldset{border:0;padding:0;margin:0 0 16px}legend{padding:0;margin-bottom:8px}
.dlg.set{max-width:480px}
@media(max-width:560px){input,textarea{font-size:16px}.scrim:has(.set){padding:0}.dlg.set{max-width:none;height:100%;border:0;border-radius:0;overflow-y:auto}}
@supports(height:100dvh){html,body{height:100dvh}}

.col{width:100%}
.row{display:flex;gap:16px;align-items:flex-start;padding:4px 0}
.row .b{flex:1 1 auto;min-width:0;max-width:100%}
.row time{flex:none;margin-top:0}
.tx{overflow-wrap:anywhere;word-break:break-word;text-wrap:pretty}
.cb,.row .b code{max-width:100%}
@media(max-width:560px){.row{display:block;padding:8px 0}.row .b{display:block}.row time{display:block;margin-top:4px;text-align:right;line-height:16px}}
.row{display:flex;align-items:baseline;gap:16px;padding:4px 0;max-width:100%}
.row .b{flex:1 1 0;min-width:0;max-width:100%}
.row time{flex:none}
.tx,.row .n{overflow-wrap:anywhere;word-break:break-word}
.row a{overflow-wrap:anywhere;word-break:break-all}
@media(max-width:720px),(orientation:portrait){.row{display:block;padding:8px 0}.row .b{display:block;width:100%}.row time{display:block;width:100%;text-align:right;line-height:16px;margin-top:4px}}

const fmt=ts=>{const d=new Date(ts),o={month:'short',day:'numeric',hour:'numeric',minute:'2-digit'};if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';return d.toLocaleString(undefined,o)};

  .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>').replace(/~~([^~\n]+)~~/g,'<s>$1</s>')
  .replace(/^&gt; ?(.*)$/gm,'<span class="q">$1</span>');
 return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>bl[i])}

function renderLog(stick){const l=$('#log');if(!l)return;const near=stick||l.scrollHeight-l.scrollTop-l.clientHeight<80,from=Math.max(guest?noon():0,clearTs);

 renderLog(true);if(g)popup();else $('#ta').focus()}
function modal(html,cls){const d=document.createElement('div');d.className='scrim';d.innerHTML=`<div class="dlg ${cls||''}" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(d);
 const c=()=>{d.remove();const s=$('#set');if(s)s.focus()};d.onkeydown=e=>{if(e.key==='Escape')c()};d.onclick=e=>{if(e.target===d)c()};return[d,c]}
function popup(){const[d,c]=modal(`<h1>Guest mode</h1><p>You can only view messages. Today’s messages are shown and reset at 12:00 pm.</p><button class="btn" id="ok">Got it</button>`);$('#ok',d).onclick=c;$('#ok',d).focus()}
function settings(){const names=['ada','linus','grace','mx','tove'];
 const[d,c]=modal(`<div class="dh"><h1>Settings</h1><button class="btn ghost" id="x">Close</button></div>
 <div class="tabs" role="tablist"><button role="tab" id="t1" aria-selected="true" aria-controls="p1">Personalization</button><button role="tab" id="t2" aria-selected="false" aria-controls="p2" tabindex="-1">General</button></div>
 <section id="p1" role="tabpanel" aria-labelledby="t1"><div class="field"><label for="mu">Name color muting: <b id="mv"></b></label><input id="mu" type="range" min="0" max="100" step="5"><span class="hint">0% is vibrant. 100% is greyscale.</span><div class="pv" id="pv"></div></div>
 <fieldset><legend>Theme</legend><label class="chk"><input type="radio" name="th" value="light"> Light</label><label class="chk"><input type="radio" name="th" value="dark"> Dark</label></fieldset></section>
 <section id="p2" role="tabpanel" aria-labelledby="t2" hidden><label class="chk"><input type="checkbox" id="wl"> Show the welcome message after login</label><p class="small muted">The message includes your last login date and time.</p></section>`,'set');
 const mu=$('#mu',d),pv=()=>{$('#mv',d).textContent=cfg().mute+'%';$('#pv',d).innerHTML=names.map(n=>`<span style="color:${nameColor(n)}">${n}</span>`).join('')};
 mu.value=cfg().mute;pv();$('#wl',d).checked=cfg().welcome;d.querySelector(`input[name=th][value=${isDark()?'dark':'light'}]`).checked=true;
 mu.oninput=()=>{cfg().mute=+mu.value;sv();pv();renderLog()};
 d.querySelectorAll('input[name=th]').forEach(r=>r.onchange=()=>{applyTheme(r.value);pv();renderLog()});
 $('#wl',d).onchange=e=>{cfg().welcome=e.target.checked;sv()};
 const tabs=[...d.querySelectorAll('[role=tab]')],pick=t=>{tabs.forEach(b=>{const on=b===t;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;$('#'+b.getAttribute('aria-controls'),d).hidden=!on});t.focus()};
 tabs.forEach((t,i)=>{t.onclick=()=>pick(t);t.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft')pick(tabs[(i+1)%2])}});
 $('#x',d).onclick=c;$('#x',d).focus()}

function composer(){const ta=$('#ta'),btn=$('#send'),note=$('#note'),cnt=$('#cnt');
 const sys=t=>{local.push({cls:'cl',text:t,ts:Date.now()});renderLog(true)};
 const upd=()=>{const n=ta.value.trim().length;cnt.textContent=`${n}/1500`+(n>=2?` · ${delay(n)}s delay`:'');ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,128)+'px'};
 const msg=(t,e)=>{note.textContent=t;note.className=e?'e':''};
 function lock(n){locked=true;btn.disabled=true;btn.textContent='Sending…';setTimeout(()=>{locked=false;btn.disabled=false;btn.textContent='Send';ta.focus()},delay(n)*1000)}
 async function post(t,act){if(t.length<2||t.length>1500){msg('Messages must be 2–1500 characters.',true);return false}
  lock(t.length);const{data,error}=await sb.rpc('post_message',{b:t,act:!!act});
  if(error){msg(/slow_down/.test(error.message)?'Too fast. Wait a moment.':'Could not send. Try again.',true);return false}
  if(data&&!msgs.some(m=>m.id===data.id)){msgs.push(norm(data));renderLog(true)}return true}
 function cmd(t){const p=t.slice(1).trim().split(/\s+/),k=p[0].toLowerCase(),a=p[1],rest=t.slice(1).trim().slice(p[0].length).trim();
  const find=n=>users.find(y=>y.username.toLowerCase()===(n||'').toLowerCase());
  switch(k){
  case 'help':['Commands (only you see these):','/me <action>     post an action','/shrug [text]     add ¯\\_(ツ)_/¯','/users           list all users','/whois <user>    member since and recent message count','/search <text>   find recent messages','/mute <user>     hide a user’s messages','/unmute <user>   show a user again','/mutelist        list users you muted','/time            your local time and timezone','/clear           clear your view (reload restores it)','/settings        open settings','/logout          log out','/help            show this list'].forEach(sys);return;
  case 'me':if(rest.length<2)return sys('Usage: /me <action>');post(rest,true);return;
  case 'shrug':post((rest+' ¯\\_(ツ)_/¯').trim());return;
  case 'users':sys('Users: '+users.map(x=>x.username).join(', '));return;
  case 'whois':{const x=find(a);if(!x)return sys(a?`No user named ${a}.`:'Usage: /whois <user>');sys(`${x.username} - member since ${fmt(Date.parse(x.created_at))}, ${msgs.filter(m=>m.by===x.username).length} recent messages`);return}
  case 'search':{if(!rest)return sys('Usage: /search <text>');const q=rest.toLowerCase(),r=msgs.filter(m=>!S.muted.includes(m.by)&&m.text.toLowerCase().includes(q)).slice(-5);
   if(!r.length)return sys('No matches.');sys(`Last ${r.length} match${r.length>1?'es':''}:`);r.forEach(m=>sys(`<${m.by}> ${m.text.slice(0,80)} (${fmt(m.ts)})`));return}
  case 'time':sys(`${new Date().toLocaleString()} (${tz})`);return;
  case 'clear':clearTs=Date.now();renderLog(true);sys('View cleared.');return;
  case 'settings':settings();return;
  case 'logout':logout();return;
  case 'mutelist':sys(S.muted.length?'Muted: '+S.muted.join(', '):'You haven’t muted anyone.');return;
  case 'mute':case 'unmute':{if(!a)return sys(`Usage: /${k} <user>`);const x=find(a);if(!x)return sys(`No user named ${a}.`);
   if(x.username===me.username)return sys('You can’t mute yourself.');const n=x.username;
   if(k==='mute'){if(S.muted.includes(n))return sys(`${n} is already muted.`);S.muted=[...S.muted,n];sys(`Muted ${n}.`)}
   else{if(!S.muted.includes(n))return sys(`${n} isn’t muted.`);S.muted=S.muted.filter(y=>y!==n);sys(`Unmuted ${n}.`)}
   sv();renderLog(true);return}
  default:sys(`Unknown command /${p[0]}. Type /help.`)}}
 async function send(){if(locked)return;const t=ta.value.trim();msg('');
  if(t.startsWith('/')){cmd(t);if(view==='chat'){ta.value='';upd()}return}
  if(await post(t)){ta.value='';upd()}}
 ta.oninput=upd;ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};btn.onclick=send}

try{applyTheme(localStorage.getItem('chatty:theme'))}catch(e){}
if(CFG.url.includes('PASTE')){auth('Setup needed','<h1>Setup needed</h1><p>Open index.html in a text editor and paste your Supabase project URL and anon key at the top of the script.</p>')}
else{sb=supabase.createClient(CFG.url,CFG.key,{auth:{storage:store,persistSession:true,autoRefreshToken:true}});
 sb.auth.getSession().then(({data})=>go(data.session?'chat':'login'))}
})();
</script>

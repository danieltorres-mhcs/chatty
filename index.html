async function kdf(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(code,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await kdf(pw,salt),new TextEncoder().encode(code));return JSON.stringify({s:b64(salt),i:b64(iv),c:b64(ct)})}
async function unseal(blob,pw){const o=JSON.parse(blob),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.i)},await kdf(pw,ub64(o.s)),ub64(o.c));return new TextDecoder().decode(pt)}

function hexHue(h){const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return 0;let hu=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;return(Math.round(hu*60)+360)%360}

function playSound(){const v=.12*(P.vol??60)/100;if(!v)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),t=a.currentTime,note=(f,s,dur,type)=>{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t+s);g.gain.exponentialRampToValueAtTime(.0001,t+s+dur);o.connect(g);g.connect(a.destination);o.start(t+s);o.stop(t+s+dur)};
 if(P.snd==='chime'){note(880,0,.18,'sine');note(1175,.12,.25,'sine')}else if(P.snd==='pop')note(320,0,.09,'triangle');else note(660,0,.2,'sine');setTimeout(()=>a.close(),700)}catch(e){}}
function kwHl(html){const w=(P.keywords||'').split(',').map(x=>x.trim()).filter(x=>x.length>1).slice(0,20);if(!w.length)return html;
 const re=new RegExp('('+w.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
 return html.split(/(<[^>]+>)/).map(sg=>sg.startsWith('<')?sg:sg.replace(re,'<span class="kw">$1</span>')).join('')}

async function busy(b,lb,fn){const o=enOf(b);b.disabled=true;b.textContent=lb;try{await fn()}finally{if(b.isConnected){b.disabled=false;b.textContent=o}}}
function field(id,label,type,hint,extra=''){return`<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" ${extra}>${hint?`<span class="hint">${hint}</span>`:''}</div>`}

function auth(title,body){document.title=title+' · Chatty';APP.innerHTML=`<main class="auth"><div class="top"><div class="brand">Chatty</div><select id="lg" class="lgsel" aria-label="Language">${langOpts()}</select></div>${body}</main>`;$('#lg').onchange=e=>setLang(e.target.value);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));const f=$('input');if(f)f.focus()}
function bad(id,msg){const e=$('#e');e.textContent=msg;const i=id&&$('#'+id);document.querySelectorAll('input').forEach(x=>x.removeAttribute('aria-invalid'));if(i){i.setAttribute('aria-invalid','true');i.focus()}}


function go(v){clearInterval(timer);clearInterval(agoTimer);if(chan){sb.removeChannel(chan);chan=null}if(pres){sb.removeChannel(pres);pres=null}view=v;({login,signup,invite,request,chat,recover})[v]()}
function login(){auth('Log in',`<h1>Log in</h1><p class="muted">Pick up where you left off.</p><form id="f" novalidate>
${field('u','Username','text','','autocomplete="username" autocapitalize="off"')}${field('p','Password','password','','autocomplete="current-password"')}
<label class="chk"><input type="checkbox" id="r"> Remember me</label><p class="err" id="e" role="alert"></p><button class="btn block" id="go">Log in</button>
<button class="btn ghost block" id="pk" type="button" style="margin-top:8px">Log in with a passkey</button></form>
<p class="alt muted">No account? <button class="link" data-go="signup">Create one</button> <button class="link" data-go="recover">Forgot password?</button></p>
<p class="muted" style="margin-top:8px"><button class="link" id="gst">Just looking? View as guest</button></p>`);
 $('#pk').onclick=()=>busy($('#pk'),'Waiting for passkey…',async()=>{localStorage.setItem(RK,$('#r').checked?'1':'0');try{const{error}=await sb.auth.signInWithPasskey();if(error)return bad('p','Passkey sign-in failed ('+(error.code||error.message||'unknown error')+').');go('chat')}catch(e){bad('p','Passkeys aren’t available in this browser.')}});
 $('#gst').onclick=()=>{guest=true;go('chat')};
 $('#f').onsubmit=ev=>{ev.preventDefault();busy($('#go'),'Logging in…',async()=>{
  localStorage.setItem(RK,$('#r').checked?'1':'0');
  const{error}=await sb.auth.signInWithPassword({email:em($('#u').value.trim()),password:$('#p').value});
  if(error)return bad('p',error.code==='invalid_credentials'?'Wrong username or password.':error.status===429?'Too many tries. Wait a few minutes and try again.':'Could not log in ('+(error.code||error.message||'unknown error')+').');go('chat')})}}
function signup(){auth('Create account',`<h1>Create account</h1><p class="muted">Pick a name. No email needed.</p><form id="f" novalidate>
${field('u','Username','text','3 or more characters. Letters, numbers, _ and -','autocomplete="username" autocapitalize="off"')}
${field('p','Password','password','6 or more characters','autocomplete="new-password"')}${field('c','Confirm password','password','','autocomplete="new-password"')}
<label class="chk"><input type="checkbox" id="r"> Remember me</label><p class="err" id="e" role="alert"></p><button class="btn block" id="go">Make account</button></form>
<p class="alt muted">Already have an account? <button class="link" data-go="login">Log in</button></p>`);
 if(pending)$('#u').value=pending.name;
 $('#f').onsubmit=ev=>{ev.preventDefault();const n=$('#u').value.trim(),p=$('#p').value,c=$('#c').value;
  if(!/^[A-Za-z0-9_-]{3,24}$/.test(n))return bad('u','Username must be 3–24 characters: letters, numbers, _ or -.');
  if(p.length<6)return bad('p','Password must be at least 6 characters.');
  if(p!==c)return bad('c','Passwords don’t match.');
  busy($('#go'),'Making account…',async()=>{const{data,error}=await sb.rpc('username_free',{n});
   if(error)return bad('u','Server problem: '+error.message);
   if(!data)return bad('u','That username is taken.');
   pending={name:n,pw:p,remember:$('#r').checked};go('invite')})}}
function recover(){auth('Reset password',`<h1>Reset password</h1><p class="muted">Use your recovery code to choose a new password.</p><form id="f" novalidate>
${field('u','Username','text','','autocomplete="username" autocapitalize="off"')}
<div class="field"><label for="k">Recovery code</label><textarea id="k" rows="3" autocomplete="off" spellcheck="false"></textarea><span class="hint">15 words, separated by spaces or hyphens.</span></div>
${field('p','New password','password','6 or more characters','autocomplete="new-password"')}${field('c','Confirm new password','password','','autocomplete="new-password"')}
<p class="err" id="e" role="alert"></p><button class="btn block" id="go">Reset password</button></form>
<p class="alt muted"><button class="link" data-go="login">Back to log in</button></p>`);
 $('#f').onsubmit=ev=>{ev.preventDefault();const n=$('#u').value.trim(),code=normCode($('#k').value),p=$('#p').value;
  if(code.split('-').length!==15)return bad('k','A recovery code has 15 words.');
  if(p.length<6)return bad('p','Password must be at least 6 characters.');
  if(p!==$('#c').value)return bad('c','Passwords don’t match.');
  busy($('#go'),'Resetting…',async()=>{const{data,error}=await sb.rpc('reset_with_recovery',{n,code,newpw:p});
   if(error)return bad('k','Could not reach the server. Try again.');
   if(data!=='ok')return bad('k','That username and recovery code don’t match.');
   localStorage.setItem(RK,'0');const{error:e2}=await sb.auth.signInWithPassword({email:em(n),password:p});
   if(e2)return go('login');
   try{await sb.rpc('set_recovery',{code,blob:await seal(code,p)})}catch(x){}go('chat')})}}
function invite(){auth('Invite code',`<h1>Wait, do I know you?</h1><p class="muted">Enter an invite code to finish creating <b>${esc(pending.name)}</b>.</p><form id="f" novalidate>
${field('k','Invite code','text','Codes expire after a few days.','autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="26"')}
<p class="err" id="e" role="alert"></p><button class="btn block" id="go">Continue</button></form>
<p class="alt muted"><button class="link" data-go="request">I don’t have a code</button><button class="link" data-go="signup">Back</button></p>`);
 const M={format:'That isn’t a valid code format.',missing:'Invite code not found.',used:'This invite code was already used.',expired:'This invite code has expired.'};
 $('#k').oninput=e=>{e.target.value=e.target.value.toUpperCase()};
 $('#f').onsubmit=ev=>{ev.preventDefault();const k=$('#k').value.trim().toUpperCase();
  busy($('#go'),'Checking…',async()=>{
   if(k==='GUEST'){pending=null;guest=true;return go('chat')}
   const{data:s,error}=await sb.rpc('check_invite',{c:k});
   if(error)return bad('k','Server problem: '+error.message);
   if(s!=='ok')return bad('k',M[s]||'Invalid code.');
   {let dv=localStorage.getItem('chatty:dev');if(!dv){dv=crypto.randomUUID();localStorage.setItem('chatty:dev',dv)}
    const{data:c,error:ce}=await sb.rpc('claim_temp_slot',{c:k,n:pending.name,dev:dv});
    if(ce)return bad('k','Could not reach the server. Try again.');
    if(c==='limit')return bad('k','This device or network already has 4 accounts from temporary codes.');
    if(c==='taken')return bad('k','That username was just taken. Go back and pick another.');
    if(c!=='ok')return bad('k','That code can’t be used right now.')}
   localStorage.setItem(RK,pending.remember?'1':'0');
   const{data,error:e2}=await sb.auth.signUp({email:em(pending.name),password:pending.pw,options:{data:{username:pending.name,invite:k}}});
   if(e2)return bad('k','Could not create the account. Try another username or code.');
   if(!data.session)return bad('k','Account made, but Supabase wants email confirmation. Turn off "Confirm email" (see the steps).');
   pending=null;go('chat')})}}
function request(){auth('Request an invite',`<h1>Request an invite</h1><p class="muted">A person reads every request. If approved, a code is sent to your contact.</p><form id="f" novalidate>
<div class="field"><label for="w">Why do you want to join?</label><textarea id="w" rows="3"></textarea></div>
${field('a','Who are you?','text','A name or handle is fine','autocomplete="off"')}${field('t','Where can we contact you?','text','Email, handle, anything that reaches you','autocomplete="off"')}
<p class="err" id="e" role="alert"></p><button class="btn block" id="go">Send request</button></form>
<p class="alt muted"><button class="link" data-go="invite">Back to invite code</button></p>`);
 $('#f').onsubmit=ev=>{ev.preventDefault();const w=$('#w').value.trim(),a=$('#a').value.trim(),t=$('#t').value.trim();
  if(!w)return bad('w','Tell us why you want to join.');if(!a)return bad('a','Tell us who you are.');if(!t)return bad('t','Add a way to reach you.');
  busy($('#go'),'Sending…',async()=>{const{error}=await sb.rpc('send_request',{w,a,t});if(error)return bad('w','Could not send. Try again.');
   $('#f').outerHTML=`<p class="ok">Request sent. If approved, a code will be sent to <b>${esc(t)}</b>.</p>`;})}}
const fmt=ts=>{const d=new Date(ts),z=P.tz||undefined,L=o=>d.toLocaleString(undefined,{...o,timeZone:z}),yr=L({year:'numeric'}),now=new Date().toLocaleString(undefined,{year:'numeric',timeZone:z});
 const t=d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',second:P.sec?'2-digit':undefined,hour12:P.h12==='12'?true:P.h12==='24'?false:undefined,timeZone:z});
 const M=L({month:'short'}),D=L({day:'numeric'}),dt=P.df==='dmy'?D+' '+M:P.df==='num'?d.toLocaleDateString(undefined,{month:'numeric',day:'numeric',timeZone:z}):M+' '+D;
 return dt+(yr!==now?' '+yr:'')+', '+t};

function noon(){const d=new Date();d.setHours(12,0,0,0);if(Date.now()<d.getTime())d.setDate(d.getDate()-1);return d.getTime()}

function nameColor(n){if(P.plain)return'var(--fg)';if(P.pcolors&&P.pcolors[n])return P.pcolors[n];
 const u=users.find(x=>x.username===n);let hue=u&&u.name_hue!=null?u.name_hue:null;

  b.innerHTML=`<h2 class="sh">Recovery code</h2><p class="small muted">Lets you reset your password if you forget it. Anyone who has it can take over your account, so keep it private.</p><div id="rcv"></div><div class="field"><label for="rcp">Your password</label><input id="rcp" type="password" autocomplete="current-password"><span class="hint">Needed to ${has?'show or replace':'create'} your code.</span></div><p class="err" id="rce" role="alert"></p><button class="btn" id="rcs">${has?'Show recovery code':'Set up recovery code'}</button>${has?'<button class="btn ghost" id="rcn" style="margin-left:8px">Make a new code</button>':''}`;
  const err=t=>{$('#rce',d).textContent=t},pw=()=>$('#rcp',d).value;
  function showCode(code){const v=$('#rcv',d);
   v.innerHTML=`<div class="code" id="rcc"></div><label class="chk"><input type="checkbox" id="rcsp"> Separate words with spaces</label><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><button class="btn ghost" id="rcc1">Copy</button><button class="btn ghost" id="rcd">Download PDF</button><button class="btn ghost" id="rch">Hide</button></div>`;
   const txt=()=>$('#rcsp',d).checked?code.replace(/-/g,' '):code,draw=()=>{$('#rcc',d).textContent=txt()};draw();$('#rcsp',d).onchange=draw;
   $('#rcc1',d).onclick=async e=>{await copyText(txt());e.target.textContent='Copied';setTimeout(()=>{e.target.textContent='Copy'},1500)};
   $('#rcd',d).onclick=()=>busy($('#rcd',d),'Making PDF…',()=>pdfCode(txt()).catch(()=>err('Could not make the PDF.')));
   $('#rch',d).onclick=()=>{v.innerHTML=''}}
  async function make(p){const{error:e1}=await sb.auth.signInWithPassword({email:em(me.username),password:p});if(e1)return err('Wrong password.');
   const code=genCode(),{error}=await sb.rpc('set_recovery',{code,blob:await seal(code,p)});if(error)return err('Could not save the code. Try again.');
   rcPending=code;drawRc()}
  $('#rcs',d).onclick=()=>busy($('#rcs',d),'Working…',async()=>{err('');const p=pw();if(!p)return err('Enter your password.');
   if(!has)return make(p);
   let code;try{const{data:bl}=await sb.rpc('get_recovery');code=await unseal(bl,p)}catch(x){return err('Wrong password.')}showCode(code)});
  if(has)$('#rcn',d).onclick=()=>busy($('#rcn',d),'Working…',async()=>{err('');const p=pw();if(!p)return err('Enter your password.');
   if(confirm('Replace your recovery code? The old one will stop working.'))await make(p)});
  if(pre)showCode(pre)}

 const tzSel=$('#p_tz',d);tzSel.innerHTML='<option value="">Device default ('+esc(tz)+')</option>'+(Intl.supportedValuesOf?Intl.supportedValuesOf('timeZone'):[]).map(z=>`<option value="${esc(z)}">${esc(z)}</option>`).join('');
 const askNotif=el=>{if(!window.Notification){P.notif=false;el.checked=false;savePrefs();return}Notification.requestPermission().then(q=>{if(q!=='granted'){P.notif=false;el.checked=false;savePrefs()}})};
 d.querySelectorAll('[data-p]').forEach(el=>{const k=el.dataset.p,show=()=>{const o=$('#v_'+k,d);if(o)o.textContent=P[k]+'%'};
  if(el.type==='checkbox')el.checked=!!P[k];else el.value=P[k];show();
  const on=()=>{P[k]=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:el.value;if(k==='batch')P.batch=+P.batch;show();if(k==='notif'&&P.notif)askNotif(el);savePrefs();applyPrefs();renderLog();if(k==='contrast')pv()};
  el.onchange=on;if(el.type==='range'||el.type==='text')el.oninput=on});

 $('#snd_t',d).onclick=playSound;
 function drawMuted(){const b=$('#mlist',d);b.textContent='';b.className='small muted';if(guest)return;if(!S.muted.length){b.textContent='You haven’t muted anyone.';return}b.className='';
  S.muted.forEach(n=>{const row=document.createElement('div');row.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px';const t=document.createElement('span');t.textContent=n;const x=document.createElement('button');x.className='btn ghost';x.textContent='Unmute';x.onclick=()=>{S.muted=S.muted.filter(y=>y!==n);sv();renderLog();drawMuted()};row.append(t,x);b.appendChild(row)})}
 function drawColors(){const b=$('#plist',d);b.textContent='';b.className='small muted';const k=Object.keys(P.pcolors||{});if(!k.length){b.textContent='None yet.';return}b.className='';
  k.forEach(n=>{const row=document.createElement('div');row.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px';const t=document.createElement('span');t.textContent=n+' · '+P.pcolors[n];t.style.color=P.pcolors[n];t.style.fontWeight='700';const x=document.createElement('button');x.className='btn ghost';x.textContent='Remove';x.onclick=()=>{delete P.pcolors[n];savePrefs();renderLog();drawColors();pv()};row.append(t,x);b.appendChild(row)})}
 drawMuted();drawColors();
 if(guest)$('#prof',d).remove();else{const nh=$('#nh',d),na=$('#nha',d),bi=$('#bio',d);nh.value=me.name_hue??0;na.checked=me.name_hue==null;bi.value=me.bio||'';let tm=null;
  const save=()=>{clearTimeout(tm);tm=setTimeout(async()=>{const ok=await saveProfile(na.checked?null:+nh.value,bi.value.trim());$('#profm',d).textContent=ok?'Saved.':'Could not save.';renderLog();pv()},500)};
  nh.oninput=()=>{na.checked=false;save()};na.onchange=save;bi.oninput=save}
 async function drawAcct(){const b=$('#p6',d);b.textContent='';
  if(guest){b.innerHTML='<p class="small muted">Log in to an account to see account options.</p>';return}
  b.innerHTML=`<h2 class="sh" style="margin-top:0">Account</h2><p id="ai" class="small muted">Loading…</p><h2 class="sh">Devices</h2><p class="small muted">Sign out everywhere except this device.</p><button class="btn ghost" id="lo">Log out other devices</button><p class="small muted" id="lom" role="status"></p><h2 class="sh">Delete account</h2><p class="small muted">Deletes your account, messages, passkeys and recovery code for good. This can’t be undone.</p><div id="dz"><button class="btn" id="dbtn" style="background:var(--err);border-color:var(--err)">Delete my account…</button></div>`;
  let n=null;try{n=(await sb.from('messages').select('id',{count:'exact',head:true}).eq('user_id',me.id)).count}catch(x){}
  $('#ai',d).textContent=`${me.username} · member since ${fmt(Date.parse(me.created_at))}`+(n==null?'':` · ${n} messages kept`);
  $('#lo',d).onclick=()=>busy($('#lo',d),'Working…',async()=>{const{error}=await sb.auth.signOut({scope:'others'});$('#lom',d).textContent=error?'Could not log out other devices.':'Other devices were logged out.'});
  $('#dbtn',d).onclick=()=>{$('#dz',d).innerHTML=`<div class="field"><label for="dn">Type your username to confirm</label><input id="dn" type="text" autocomplete="off"></div><div class="field"><label for="dp">Your password</label><input id="dp" type="password" autocomplete="current-password"></div><p class="err" id="de" role="alert"></p><button class="btn" id="dgo" style="background:var(--err);border-color:var(--err)">Delete forever</button> <button class="btn ghost" id="dno">Cancel</button>`;
   $('#dno',d).onclick=drawAcct;
   $('#dgo',d).onclick=()=>busy($('#dgo',d),'Deleting…',async()=>{const e=$('#de',d);e.textContent='';
    if($('#dn',d).value.trim().toLowerCase()!==me.username.toLowerCase())return e.textContent='The username doesn’t match.';
    const{error:e1}=await sb.auth.signInWithPassword({email:em(me.username),password:$('#dp',d).value});if(e1)return e.textContent='Wrong password.';
    const{error:e2}=await sb.rpc('delete_account');if(e2)return e.textContent='Could not delete the account. Try again.';
    await sb.auth.signOut();guest=false;me=null;c();go('login')})}}

 const lg=$('#langs',d),drawLang=()=>{lg.textContent='';LANGS.forEach(([c,f,n])=>{const b=document.createElement('button');b.type='button';b.className='lang'+(c===LANG?' on':'');b.lang=c;b.textContent=f+' '+n;b.onclick=()=>{setLang(c);drawLang()};lg.appendChild(b)})};drawLang();
 $('#x',d).onclick=c;$('#x',d).focus()}

function composer(){const ta=$('#ta'),btn=$('#send'),note=$('#note'),cnt=$('#cnt');
 const sys=t=>{local.push({cls:'cl',text:t,ts:Date.now()});renderLog(true)};
 const upd=()=>{const n=ta.value.trim().length;const pc=pingsIn(ta.value);cnt.textContent=`${n}/1500`+(n>=2?` · ${delay(n)+pc}s delay`:'')+(pc?` · ${pc}/5 pings`:'');ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,128)+'px'};
 const msg=(t,e)=>{note.textContent=t;note.className=e?'e':''};
 function lock(n,pc=0){locked=true;btn.disabled=true;btn.textContent='Sending…';setTimeout(()=>{locked=false;btn.disabled=false;btn.textContent='Send';ta.focus()},(delay(n)+pc)*1000)}
 async function post(t,act){if(locked){msg('Wait a moment before sending again.',true);return false}if(t.length<2||t.length>1500){msg('Messages must be 2–1500 characters.',true);return false}
  const pc=pingsIn(t);if(pc>5){msg('You can ping at most 5 people per message.',true);return false}
  lock(t.length,pc);const{data,error}=await sb.rpc('post_message',{b:t,act:!!act});
  if(error){msg(/too_many_pings/.test(error.message)?'You can ping at most 5 people per message.':/slow_down/.test(error.message)?'Too fast. Wait a moment.':'Could not send. Try again.',true);return false}
  if(data&&!msgs.some(m=>m.id===data.id)){msgs.push(norm(data));renderLog(true)}return true}
 function cmd(t){const p=t.slice(1).trim().split(/\s+/),k=p[0].toLowerCase(),a=p[1],rest=t.slice(1).trim().slice(p[0].length).trim();
  const find=n=>users.find(y=>y.username.toLowerCase()===(n||'').toLowerCase());
  switch(k){
  case 'help':['Commands (only you see these):','/me <action>   /shrug [text]   /roll 2d6   /coin','/tableflip   /unflip   /lenny','/quote <user>     put their last message in your box','/edit <text>      edit your last message (within 5 min)','/deletelast       delete your last message (within 15 min, once per message)','/online (or /who) see who is here now','/users   /whois <user>   /search [from:user] <text>','/mute <user>   /unmute <user>   /mutelist','/color #hex | reset | <user> #hex | <user> reset','/bio <text>       set your bio','/theme   /size   /font   /timestamps   /sound','/time   /clear   /copy   /export   /settings   /about   /logout','/help             show this list'].forEach(sys);return;
  case 'me':if(rest.length<2)return sys('Usage: /me <action>');post(rest,true);return;
  case 'shrug':post((rest+' ¯\\_(ツ)_/¯').trim());return;
  case 'users':sys('Users: '+users.map(x=>x.username).join(', '));return;
  case 'whois':{const x=find(a);if(!x)return sys(a?`No user named ${a}.`:'Usage: /whois <user>');sys(`${x.username} - member since ${fmt(Date.parse(x.created_at))}, ${msgs.filter(m=>m.by===x.username).length} recent messages`+(x.bio?` - “${x.bio}”`:''));return}
  case 'search':{if(!rest)return sys('Usage: /search [from:user] <text>');const fm=/(?:^|\s)from:(\S+)/i.exec(rest),q=rest.replace(/(?:^|\s)from:\S+/i,'').trim().toLowerCase(),r=msgs.filter(m=>!m.cls&&!S.muted.includes(m.by)&&(!fm||m.by.toLowerCase()===fm[1].toLowerCase())&&m.text.toLowerCase().includes(q)).slice(-5);
   if(!r.length)return sys('No matches.');sys(`Last ${r.length} match${r.length>1?'es':''}:`);r.forEach(m=>sys(`<${m.by}> ${m.text.slice(0,80)} (${fmt(m.ts)})`));return}
  case 'time':sys(`${fmt(Date.now())} (${tzNow()})`);return;
  case 'clear':clearTs=Date.now();renderLog(true);sys('View cleared.');return;
  case 'settings':settings();return;
  case 'logout':logout();return;
  case 'mutelist':sys(S.muted.length?'Muted: '+S.muted.join(', '):'You haven’t muted anyone.');return;
  case 'mute':case 'unmute':{if(!a)return sys(`Usage: /${k} <user>`);const x=find(a);if(!x)return sys(`No user named ${a}.`);
   if(x.username===me.username)return sys('You can’t mute yourself.');const n=x.username;
   if(k==='mute'){if(S.muted.includes(n))return sys(`${n} is already muted.`);S.muted=[...S.muted,n];sys(`Muted ${n}.`)}
   else{if(!S.muted.includes(n))return sys(`${n} isn’t muted.`);S.muted=S.muted.filter(y=>y!==n);sys(`Unmuted ${n}.`)}
   sv();renderLog(true);return}
  case 'theme':{const v=(a||'').toLowerCase();if(!['auto','light','dark','paper','midnight','terminal'].includes(v))return sys('Usage: /theme auto|light|dark|paper|midnight|terminal');applyTheme(v);renderLog();return sys('Theme: '+v)}
  case 'size':{const n=+a;if(!(n>=80&&n<=150))return sys('Usage: /size 80-150');P.fs=Math.round(n);savePrefs();applyPrefs();return sys('Text size: '+P.fs+'%')}
  case 'font':{const v={mono:'mono',sans:'sans',atkinson:'atk',dyslexic:'dys'}[(a||'').toLowerCase()];if(!v)return sys('Usage: /font mono|sans|atkinson|dyslexic');P.font=v;savePrefs();applyPrefs();return sys('Font: '+a.toLowerCase())}
  case 'timestamps':case 'sound':{const v=(a||'').toLowerCase();if(v!=='on'&&v!=='off')return sys(`Usage: /${k} on|off`);const on=v==='on';if(k==='sound'){P.sound=on;savePrefs()}else{try{localStorage.setItem('chatty:ts',on?'1':'0')}catch(x){}renderLog()}return sys(`${k==='sound'?'Ping sound':'Timestamps'}: ${v}`)}
  case 'about':sys('Chatty - made by Dani. See Settings > Credits for everyone who helped.');return;
  case 'online':case 'who':sys(online.length?`Online now (${online.length}): `+online.join(', '):'No one else is online right now.');return;
  case 'roll':{const m=/^(\d{1,2})?d(\d{1,3})$/i.exec(a||'1d6');if(!m||+m[2]<2)return sys('Usage: /roll 2d6');const n=+(m[1]||1),f=+m[2],q=Array.from({length:n},()=>1+Math.floor(Math.random()*f));post(`rolled ${n}d${f}: ${q.join(' + ')}${n>1?' = '+q.reduce((x,y)=>x+y):''}`,true);return}
  case 'coin':post(`flipped a coin: ${Math.random()<.5?'heads':'tails'}`,true);return;
  case 'tableflip':post('(╯°□°)╯︵ ┻━┻');return;
  case 'unflip':post('┬─┬ノ( º _ ºノ)');return;
  case 'lenny':post('( ͡° ͜ʖ ͡°)');return;
  case 'quote':{const x=[...msgs].reverse().find(m=>!m.cls&&m.by.toLowerCase()===(a||'').toLowerCase());if(!x)return sys(a?`No recent message from ${a}.`:'Usage: /quote <user>');ta.value='> '+x.text.replace(/\s+/g,' ').slice(0,300)+'\n';upd();ta.focus();return true}
  case 'bio':saveProfile(me.name_hue??null,rest.slice(0,140)).then(ok=>sys(ok?(rest?'Bio saved.':'Bio cleared.'):'Could not save your bio.'));return;
  case 'color':{const hx=v=>/^#?[0-9a-f]{6}$/i.test(v||'')?'#'+v.replace('#','').toLowerCase():null;
   if(!p[2]&&a&&(a==='reset'||hx(a))){const h=a==='reset'?null:hexHue(hx(a));saveProfile(h,me.bio).then(ok=>{sys(ok?(h==null?'Your name color is automatic again.':'Your name color is set. Everyone sees it.'):'Could not save.');renderLog()});return}
   const x=find(a);if(!x||!p[2])return sys('Usage: /color #rrggbb  |  /color reset  |  /color <user> #rrggbb  |  /color <user> reset');
   if(p[2]==='reset'){delete P.pcolors[x.username];savePrefs();renderLog();return sys(`Color for ${x.username} reset.`)}
   if(!hx(p[2]))return sys('Use a color like #4a7bd0.');P.pcolors[x.username]=hx(p[2]);savePrefs();renderLog();return sys(`${x.username} now shows in ${hx(p[2])} on your screen.`)}
  case 'deletelast':sb.rpc('delete_last_message').then(({error})=>sys(error?(/too_old/.test(error.message)?'Too late: you can only delete a message within 15 minutes of sending it.':/already_used/.test(error.message)?'You already used /deletelast on your latest message. Send a new one first.':'Nothing to delete.'):'Deleted your last message.'));return;
  case 'edit':if(rest.length<2)return sys('Usage: /edit <new text>');sb.rpc('edit_last_message',{b:rest}).then(({error})=>sys(error?(/too_old/.test(error.message)?'You can only edit a message within 5 minutes of sending it.':/too_many_pings/.test(error.message)?'You can ping at most 5 people per message.':'Could not edit your last message.'):'Edited your last message.'));return;
  case 'export':{const t=msgs.concat(local).filter(m=>m.ts>=Math.max(guest?noon():0,clearTs)&&!S.muted.includes(m.by)).sort((x,y)=>x.ts-y.ts).map(m=>`[${fmt(m.ts)}] ${m.cls?'* '+m.text:(m.me?'* '+m.by+' ':'<'+m.by+'> ')+m.text}`).join('\n'),u=URL.createObjectURL(new Blob([t],{type:'text/plain'})),l=document.createElement('a');l.href=u;l.download='chatty-export.txt';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);return sys('Saved what you can see to chatty-export.txt.')}
  case 'copy':{const x=[...msgs].reverse().find(m=>!m.cls);if(!x)return sys('Nothing to copy.');copyText(x.text);return sys('Copied the last message.')}
  default:sys(`Unknown command /${p[0]}. Type /help.`)}}
 async function send(){const t=ta.value.trim();msg('');
  if(t.startsWith('/')){const keep=cmd(t);if(view==='chat'&&!keep){ta.value='';upd()}return}
  if(locked)return;
  if(await post(t)){ta.value='';upd()}}
 const sug=$('#sug');let sel=0,items=[],tok=null;
 const token=()=>{const p=ta.selectionStart,m=/(^|[^A-Za-z0-9_@-])@([A-Za-z0-9_-]{0,24})$/.exec(ta.value.slice(0,p));return m?{start:p-m[2].length-1,end:p,q:m[2]}:null};
 function drawSug(){sug.innerHTML=items.map((n,i)=>`<button type="button" role="option" aria-selected="${i===sel}" data-n="${esc(n)}" style="color:${nameColor(n)}">@${esc(n)}</button>`).join('')}
 function showSug(){tok=token();if(!tok)return sug.hidden=true;const q=tok.q.toLowerCase(),all=users.map(u=>u.username).filter(n=>n!==me.username);
  items=[...all.filter(n=>n.toLowerCase().startsWith(q)),...all.filter(n=>!n.toLowerCase().startsWith(q)&&n.toLowerCase().includes(q))].slice(0,6);
  if(!items.length)return sug.hidden=true;sel=0;drawSug();sug.hidden=false}
 function pickSug(n){const v=ta.value;ta.value=v.slice(0,tok.start)+'@'+n+' '+v.slice(tok.end);const c=tok.start+n.length+2;ta.setSelectionRange(c,c);sug.hidden=true;upd();ta.focus()}
 sug.onmousedown=e=>{e.preventDefault();const b=e.target.closest('button');if(b)pickSug(b.dataset.n)};
 ta.oninput=()=>{upd();showSug()};ta.onclick=showSug;ta.onblur=()=>setTimeout(()=>{sug.hidden=true},120);
 ta.onkeydown=e=>{if(!sug.hidden){
   if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:items.length-1))%items.length;drawSug();return}
   if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();pickSug(items[sel]);return}
   if(e.key==='Escape'){e.preventDefault();sug.hidden=true;return}}
  if(e.key==='Enter'&&(P.send==='ctrl'?(e.ctrlKey||e.metaKey):!e.shiftKey)){e.preventDefault();send()}};btn.onclick=send}

try{applyTheme(localStorage.getItem('chatty:theme'))}catch(e){}applyPrefs();startI18n();
if(CFG.url.includes('PASTE')){auth('Setup needed','<h1>Setup needed</h1><p>Open index.html in a text editor and paste your Supabase project URL and anon key at the top of the script.</p>')}
else{sb=supabase.createClient(CFG.url,CFG.key,{auth:{storage:store,persistSession:true,autoRefreshToken:true,experimental:{passkey:true}}});
 sb.auth.getSession().then(({data})=>go(data.session?'chat':'login'))}
})();
